{% extends "tracker/base_auth.html" %}
{% load static %}
{% block content %}

<div class="container" style="max-width: 500px; margin-top: 60px;">
    <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center mb-4 fw-bold">Create Account</h2>

        <!-- show error / success messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">👤 Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label for="id_email" class="form-label">📧 Email</label>
                <input type="email" name="email" id="id_email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label for="id_password1" class="form-label">🔒 Password</label>
                <input type="password" name="password1" id="id_password1" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label for="id_password2" class="form-label">✅ Confirm Password</label>
                <input type="password" name="password2" id="id_password2" class="form-control" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Register</button>
        </form>

        <div class="text-center mt-3">
            <p class="mb-1">Already have an account? 
                <a href="{% url 'login' %}" class="fw-semibold">Login</a>
            </p>
            <a href="{% url 'password_reset' %}">Forgot password?</a>
        </div>
    </div>
</div>

{% endblock %}
