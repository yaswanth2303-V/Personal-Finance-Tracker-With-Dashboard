{% extends "tracker/base_auth.html" %}
{% load static %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        border-radius: 15px;
        overflow: hidden;
        animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .form-control {
        border-radius: 10px;
    }
    .btn-custom {
        border-radius: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    .extra-links a {
        margin: 0 8px;
        text-decoration: none;
        font-size: 0.9rem;
    }
</style>
<div class="container" style="max-width: 420px;">
    <div class="card shadow p-4 login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Welcome Back 👋</h2>
            <p class="text-muted">Login to your Personal Finance Tracker</p>
        </div>

        <!-- messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="needs-validation">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 btn-custom">🔑 Login</button>
        </form>

        <div class="text-center mt-3 extra-links">
            <a href="{% url 'register' %}" class="text-decoration-none">Create an account</a> |
            <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot password?</a>
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

{% endblock %}
