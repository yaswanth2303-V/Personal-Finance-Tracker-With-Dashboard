{% extends "tracker/base.html" %}
{% load static %}
{% block content %}

        <h1>Finance Tracker</h1>
    
    
    <div class="wrapper">
        <h2 class="text-center mb-4">Add Transaction</h2>

       <form method="post">
    {% csrf_token %}
    <p>
        <label for="id_description">Description:</label>
        <input type="text" name="description" id="id_description" required>
    </p>
    <p>
        <label for="id_amount">Amount:</label>
        <input type="number" name="amount" step="0.01" id="id_amount" required>
    </p>
    <p>
        <label for="id_category">Category:</label>
        <select name="category" id="id_category" required>
            {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
             {% empty %}
                <option disabled>No categories available</option>   
            {% endfor %}
        </select>
    </p>
    <p>
        <label for="id_transaction_type">Type:</label>
        <select name="transaction_type" id="id_transaction_type" required>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
    </p>
    <p>
        <label for="id_date">Date:</label>
        <input type="date" name="date" id="id_date" required>
    </p>

    <button type="submit" class="btn btn-dark w-100 mt-3">Save Transaction</button>
</form>
 

        <div class="text-center mt-3">
            <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
        </div>
    </div>
</div>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f8;
    color: #080808ff;
}

.wrapper {
    max-width: 650px;
    margin: 40px auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
}

h2 { text-align: center; margin-bottom: 25px; font-size: 1.6rem; }
form p { margin-bottom: 18px; }
label { font-weight: 600; }
input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 6px;
    box-sizing: border-box;
}

button {
    display: block;
    width: 100%;
    padding: 12px;
    background: #0d0d0e;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover { background: #0a0c0d; }
.back-link { text-align: center; margin-top: 18px; }
.back-link a { color: #070809; text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
</style>
{% endblock %}
