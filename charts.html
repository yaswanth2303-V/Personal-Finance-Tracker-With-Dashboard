{% extends "tracker/base.html" %}
{% load static %}
{% block content %}
<div class="container mt-4">

    <!-- Charts Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary">📊 Charts Overview</h3>
    </div>

    <div class="row">
        <!-- Category-wise Expense Pie Chart -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 p-3">
                <h5 class="fw-bold text-secondary mb-3">Category-wise Expenses</h5>
                <canvas id="expensePieChart"></canvas>
            </div>
        </div>
    <!-- Monthly Income vs Expense Line Chart -->
         <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 p-3">
              <b>  <h5 class="fw-bold text-secondary mb-3">Monthly Income vs Expense (line)</h5> </b>
                <canvas id="incomeLineChart"></canvas>
            </div>
        </div>

        <!-- Monthly Income vs Expense Bar Chart -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 p-3">
                <h5 class="fw-bold text-secondary mb-3">Monthly Income vs Expense</h5>
                <canvas id="incomeBarChart"></canvas>
            </div>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Pie Chart - Category-wise Expenses
    const pieCtx = document.getElementById('expensePieChart').getContext('2d');
    new Chart(pieCtx, {
        type: 'pie',
        data: {
            labels: {{ pie_labels|safe }},
            datasets: [{
                data: {{ pie_data|safe }},
                backgroundColor: [
                    '#FF6384', '#36A2EB', '#FFCE56',
                    '#4BC0C0', '#9966FF', '#FF9F40'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } }
        }
    });

    // Line Chart - Monthly Income vs Expense
    const lineCtx = document.getElementById('incomeLineChart').getContext('2d');
    new Chart(lineCtx, {
        type: 'line',
        data: {
            labels: {{ months|safe }},
            datasets: [
                {
                    label: 'Income',
                    data: {{ income_data|safe }},
                    borderColor: 'green',
                    backgroundColor: 'rgba(0,255,0,0.1)',
                    fill: true,
                    tension: 0.3
                },
                {
                    label: 'Expense',
                    data: {{ expense_data|safe }},
                    borderColor: 'red',
                    backgroundColor: 'rgba(255,0,0,0.1)',
                    fill: true,
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'top' },
                tooltip: { mode: 'index', intersect: false }
            },
            interaction: { mode: 'nearest', intersect: false },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Bar Chart - Monthly Income vs Expense
    const barCtx = document.getElementById('incomeBarChart').getContext('2d');
    new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: {{ months|safe }},
            datasets: [
                {
                    label: 'Income',
                    data: {{ income_data|safe }},
                    backgroundColor: 'rgba(0,128,0,0.7)'
                },
                {
                    label: 'Expense',
                    data: {{ expense_data|safe }},
                    backgroundColor: 'rgba(255,0,0,0.7)'
                }
            ]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } },
            scales: {
                x: { stacked: false },
                y: { stacked: false, beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
