{% extends "tracker/base.html" %}
{% block content %}

<div class="container" style="max-width: 480px; margin-top: 60px;">
  <div class="card shadow p-4 login-card">
      <h2 class="fw-bold text-success text-center mb-3">🔑 Set New Password</h2>

      {% if validlink %}
          <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                  <label class="form-label">New Password</label>
                  <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                      <input type="password" name="new_password1" class="form-control" placeholder="Enter new password" required>
                  </div>
              </div>
              <div class="mb-3">
                  <label class="form-label">Confirm New Password</label>
                  <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-check-circle-fill"></i></span>
                      <input type="password" name="new_password2" class="form-control" placeholder="Confirm new password" required>
                  </div>
              </div>
              <button type="submit" class="btn btn-success w-100">✅ Reset Password</button>
          </form>
      {% else %}
          <div class="alert alert-danger text-center">Invalid or expired link</div>
          <a href="{% url 'password_reset' %}" class="btn btn-dark w-100">Request Again</a>
      {% endif %}
  </div>
</div>

{% endblock %}
