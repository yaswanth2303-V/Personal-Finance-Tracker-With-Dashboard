{% extends "tracker/base.html" %}
{% block content %}

<div class="container" style="max-width: 480px; margin-top: 60px;">
  <div class="card shadow p-4 text-center login-card">
      <h2 class="fw-bold text-info">📩 Check Your Email</h2>
      <p class="text-muted">
          If an account exists with the provided email, a password reset link has been sent.  
          Please check your inbox and spam folder.
      </p>
      <a href="{% url 'login' %}" class="btn btn-info w-100 mt-3">🔙 Back to Login</a>
  </div>
</div>

{% endblock %}
