{% extends "tracker/base.html" %}
{% load static %}
{% block content %}

<div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card shadow p-4 login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-warning">🔑 Reset Password</h2>
            <p class="text-muted">Enter your registered email to reset your password</p>
        </div>

        <!-- messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label fw-semibold">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 btn-custom">📩 Send Reset Link</button>
        </form>

        <div class="text-center mt-3 extra-links">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>
</div>

{% endblock %}
